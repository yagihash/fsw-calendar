    action_name: cicd-sensor/cicd-sensor-action
  - policy_name: action_ref_should_be_full_length_commit_sha
    action_name: dorny/paths-filter
  - policy_name: action_ref_should_be_full_length_commit_sha
    action_name: google-github-actions/auth
  - policy_name: action_ref_should_be_full_length_commit_sha
    action_name: pnpm/action-setup
