name: CI

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: cicd-sensor/cicd-sensor-action@v0.0.41
        with:
          enable-html-report: "false"
          enable-attestation-artifact: "false"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          filters: |
            # ghalint / actionlint の検査対象（と、その設定）だけを見る。.github/ 配下でも CODEOWNERS や release.yml などでは走らせない。
            workflows:
              - '.github/workflows/**'
              - '**/action.yml'
              - '**/action.yaml'
              - '.github/actionlint.yaml'
              - '.github/actionlint.yml'
              - '.ghalint.yaml'
              - '.ghalint.yml'
              - 'ghalint.yaml'
              - 'ghalint.yml'
              - '.github/ghalint.yaml'
              - '.github/ghalint.yml'

  ghalint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read

    steps:
      - uses: cicd-sensor/cicd-sensor-action@v0.0.41
        with:
          enable-html-report: "false"
          enable-attestation-artifact: "false"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install ghalint
        run: |
          # renovate: datasource=github-releases depName=suzuki-shunsuke/ghalint
          version=v1.6.0
          gh release download -R suzuki-shunsuke/ghalint "${version}" -p "ghalint_${version#v}_linux_amd64.tar.gz"
          gh attestation verify "ghalint_${version#v}_linux_amd64.tar.gz" \
            -R suzuki-shunsuke/ghalint \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          tar xzf "ghalint_${version#v}_linux_amd64.tar.gz" ghalint
        env:
          GH_TOKEN: ${{ github.token }}

      # Run the two independent ghalint checks concurrently using the new
      # parallel steps feature (background steps + wait-all).
      # https://github.blog/changelog/2026-06-25-actions-steps-can-now-be-run-in-parallel/
      - name: Run ghalint run
        run: ./ghalint run
        background: true

      - name: Run ghalint act
        run: ./ghalint act
        background: true

      - wait-all:

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read

    steps:
      - uses: cicd-sensor/cicd-sensor-action@v0.0.41
        with:
          enable-html-report: "false"
          enable-attestation-artifact: "false"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version=v1.7.12
          gh release download -R rhysd/actionlint "${version}" -p "actionlint_${version#v}_linux_amd64.tar.gz"
          gh attestation verify "actionlint_${version#v}_linux_amd64.tar.gz" --repo rhysd/actionlint
          tar xzf "actionlint_${version#v}_linux_amd64.tar.gz" actionlint
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run actionlint
        run: |
          ./actionlint \
            -ignore 'unexpected key "background"' \
            -ignore 'step must run script with "run" section or run action with "uses" section'

  actions-lock:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: cicd-sensor/cicd-sensor-action@v0.0.41
        with:
          enable-html-report: "false"
          enable-attestation-artifact: "false"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: |
          # renovate: datasource=github-releases depName=github/gh-actions-lock
          version=v0.4.1
          gh extension install github/gh-actions-lock --pin "${version}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify actions.lock
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: cicd-sensor/cicd-sensor-action@v0.0.41
        with:
          enable-html-report: "false"
          enable-attestation-artifact: "false"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm exec tsc --noEmit

      - name: test
        run: pnpm test

  # The one check that a ruleset requires. Every job above is in `needs`: it fails when one of them failed or was cancelled, and passes
  # when they passed or were skipped (no workflow changed). A job added above has to be added here.
  ci-ok:
    if: always()
    needs: [changes, ghalint, actionlint, actions-lock, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: yagihash/actions/ci-ok@b2075301726190d59d2cf57e54d62700c55ae134 # v0.1.0
        with:
          needs: ${{ toJSON(needs) }}
          filter-job: changes
          filter-outputs: workflows
