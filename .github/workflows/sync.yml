name: sync

on:
  # TODO: 取得先URL変更への対応が完了するまで一時停止中
  # schedule:
  #   - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: main
      deployment: false
    strategy:
      matrix:
        include:
          - name: r-4
            class: r-4
            calendar_id: a7d264798dfbd87a96929ea4ae415b9c900a645b73403835a6b1621dbbd668cd@group.calendar.google.com
          - name: s-4
            class: s-4
            calendar_id: 4fca9ba5c00115af8aed9cbc340772ea5c5e64b3dfa975732f6e767862f405b1@group.calendar.google.com
          - name: n-4
            class: n-4
            calendar_id: bdb6d8a80c9cdfd605319bc879d626d79fda0394cdeb231c25a7a4278f6f28ef@group.calendar.google.com
          - name: l-4
            class: l-4
            calendar_id: 0e51d284e64c42f6067a27721b921e1dcb4759f04bbed5cf4fd4faff2e20071b@group.calendar.google.com
          - name: s-course-4
            class: s-course-4
            calendar_id: b78abe03924c2624a1c0f4271fcb6eb2a90a68f2029f239763ce06df1fb711fb@group.calendar.google.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}

      - name: sync
        env:
          CALENDAR_ID: ${{ matrix.calendar_id }}
          CLASS: ${{ matrix.class }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: pnpm exec tsx ./cmd/run/main.ts
