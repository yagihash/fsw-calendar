name: sync

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  # fetches the schedules of every class at once, to keep the requests to the site few
  fetch:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: main
      deployment: false
    permissions:
      contents: read
    outputs:
      events: ${{ steps.fetch.outputs.events }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: fetch
        id: fetch
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: pnpm exec tsx ./cmd/fetch/main.ts

  register:
    needs: fetch
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: main
      deployment: false
    permissions:
      contents: read
      id-token: write
    strategy:
      # a failure of a calendar must not cancel the others
      fail-fast: false
      matrix:
        class:
          - r-4
          - s-4
          - n-4
          - l-4
          - s-course-4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}

      - name: register
        env:
          CLASS: ${{ matrix.class }}
          EVENTS: ${{ needs.fetch.outputs.events }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: pnpm exec tsx ./cmd/run/main.ts
